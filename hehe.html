<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Önemli Soru</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 100%);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        /* Animasyonlu arka plan - başta gizli */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s;
        }
        
        .bg-animation.active {
            opacity: 0.3;
        }
        
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,0,0,0.3) 0%, transparent 70%);
            animation: float 20s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        /* Parçacık sistemi */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff0000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            opacity: 0;
        }
        
        @keyframes particle-burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
        
        .baslik-konteynir {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            z-index: 99999;
            pointer-events: none;
            position: relative;
        }
        
        .baslik-konteynir.active {
            animation: glow-pulse 3s ease-in-out infinite;
        }
        
        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255,0,0,0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255,0,0,0.8)); }
        }
        
        .baslik {
            display: block;
            font-size: 2.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .baslik.alt {
            font-size: 3rem;
            color: #ff0000;
            margin-top: 5px;
            text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.4);
        }
        
        .baslik.alt.active {
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .button-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 30px;
            z-index: 100;
        }
        
        .btn {
            padding: 20px 50px;
            font-size: 1.6rem;
            font-weight: 900;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        #noBtn {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #fff;
            border: 3px solid #fff;
            position: relative;
        }
        
        #yesBtn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #fff;
            border: 3px solid #fff;
        }
        
        /* Aktif modda HAYIR minicik olur */
        #noBtn.mini {
            position: absolute !important;
            padding: 15px 40px;
            font-size: 1.4rem;
            z-index: 9999;
        }
        
        #yesBtn.hidden {
            display: none;
        }
        
        .btn.is-yes {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%) !important;
            animation: celebrate 0.5s ease-in-out !important;
        }
        
        @keyframes celebrate {
            0%, 100% { transform: scale(1.5) rotate(0deg); }
            25% { transform: scale(1.7) rotate(-10deg); }
            75% { transform: scale(1.7) rotate(10deg); }
        }
        
        .yes-btn {
            position: absolute;
            z-index: 500;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: 900;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .yes-btn.active {
            opacity: 1;
            animation: float-gentle 3s ease-in-out infinite;
        }
        
        @keyframes float-gentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .yes-0 { 
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            animation-delay: 0s;
        }
        .yes-1 { 
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            animation-delay: 0.3s;
        }
        .yes-2 { 
            background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            color: #000;
            animation-delay: 0.6s;
        }
        .yes-3 { 
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            animation-delay: 0.9s;
        }
        .yes-4 { 
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            animation-delay: 1.2s;
        }
        
        /* Konfeti efekti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            z-index: 9999;
            animation: confetti-fall 3s linear forwards;
        }
        
        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* Mesaj kutusu */
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            padding: 40px 60px;
            border-radius: 20px;
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            z-index: 100000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            border: 3px solid #fff;
        }
        
        .message-box.show {
            animation: message-appear 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        
        @keyframes message-appear {
            to { transform: translate(-50%, -50%) scale(1); }
        }
        
        .emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
            animation: bounce 0.6s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes crazy-spin {
            0% { transform: rotate(0deg) scale(0.5); }
            100% { transform: rotate(1080deg) scale(0.5); }
        }
        
        @keyframes vibrate {
            0%, 100% { transform: translate(0, 0) scale(0.5); }
            10% { transform: translate(-3px, -3px) scale(0.5); }
            20% { transform: translate(3px, 3px) scale(0.5); }
            30% { transform: translate(-3px, 3px) scale(0.5); }
            40% { transform: translate(3px, -3px) scale(0.5); }
            50% { transform: translate(-3px, -3px) scale(0.5); }
            60% { transform: translate(3px, 3px) scale(0.5); }
            70% { transform: translate(-3px, 3px) scale(0.5); }
            80% { transform: translate(3px, -3px) scale(0.5); }
            90% { transform: translate(-3px, -3px) scale(0.5); }
        }
    </style>
</head>
<body>
    <!-- Animasyonlu arka plan -->
    <div class="bg-animation" id="bgAnimation"></div>
    
    <div class="baslik-konteynir" id="baslikKonteynir">
        <span class="baslik">BU SENE İŞTEN ÇIKACAK MISIN</span>
        <span class="baslik alt" id="altBaslik">SENCE ??</span>
    </div>
    
    <div class="button-container" id="buttonContainer">
        <button class="btn" id="yesBtn">EVET</button>
        <button class="btn" id="noBtn">HAYIR</button>
    </div>
    
    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const buttonContainer = document.getElementById('buttonContainer');
        const bgAnimation = document.getElementById('bgAnimation');
        const baslikKonteynir = document.getElementById('baslikKonteynir');
        const altBaslik = document.getElementById('altBaslik');
        
        const yesButtons = [];
        let gameStarted = false;
        let escapeCount = 0;
        let isTransformed = false;
        let crazyModeActive = false;
        let blockingActive = false;
        
        // Arka plan animasyon çemberleri oluştur
        for (let i = 0; i < 5; i++) {
            const circle = document.createElement('div');
            circle.className = 'bg-circle';
            circle.style.width = (100 + Math.random() * 200) + 'px';
            circle.style.height = circle.style.width;
            circle.style.left = Math.random() * 100 + '%';
            circle.style.top = Math.random() * 100 + '%';
            circle.style.animationDelay = (Math.random() * 5) + 's';
            bgAnimation.appendChild(circle);
        }
        
        // 5 EVET butonu oluştur (başta gizli)
        for (let i = 0; i < 5; i++) {
            const btn = document.createElement('button');
            btn.className = `btn yes-btn yes-${i}`;
            btn.innerText = 'EVET';
            btn.onclick = () => showMessage();
            
            const initialScale = 0.8 + Math.random() * 0.5;
            btn.style.transform = `scale(${initialScale})`;
            btn.dataset.scale = initialScale;
            
            document.body.appendChild(btn);
            yesButtons.push(btn);
        }
        
        // Oyunu başlat
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            
            // Görsel efektleri aktifleştir
            bgAnimation.classList.add('active');
            baslikKonteynir.classList.add('active');
            altBaslik.classList.add('active');
            
            // Orijinal buton konteynırını gizle
            buttonContainer.style.opacity = '0';
            setTimeout(() => {
                buttonContainer.style.display = 'none';
            }, 300);
            
            // HAYIR'ı minicik yap ve konumlandır
            setTimeout(() => {
                noBtn.classList.add('mini');
                yesBtn.classList.add('hidden');
                posBtn(noBtn, false);
                noBtn.style.transform = 'scale(0.5)';
                noBtn.style.opacity = '1';
            }, 400);
            
            // EVET butonlarını göster
            setTimeout(() => {
                yesButtons.forEach((btn, idx) => {
                    posBtn(btn, true);
                    setTimeout(() => {
                        btn.classList.add('active');
                    }, idx * 150);
                });
            }, 600);
            
            // Kaos sistemini başlat
            setTimeout(() => {
                startChaos();
            }, 2000);
        }
        
        function posBtn(el, isYesBtn = false) {
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 100;
            
            if (isYesBtn) {
                const x = Math.random() * maxX;
                const y = 200 + Math.random() * (maxY - 200);
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            } else {
                const x = Math.random() * maxX;
                const y = 250 + (Math.random() * (window.innerHeight - 350));
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            }
        }
        
        // Parçacık patlaması efekti
        function createParticleBurst(x, y, color = '#ff0000') {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 * i) / 20;
                const velocity = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animation = `particle-burst 0.6s ease-out forwards`;
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }
        
        // Konfeti yağmuru
        function createConfetti(count = 100) {
            const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#9b59b6', '#3498db', '#2ecc71'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (5 + Math.random() * 10) + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 15);
            }
        }
        
        // Mesaj kutusu göster
        function showMessage() {
            createConfetti(200);
            const messageBox = document.createElement('div');
            messageBox.className = 'message-box';
            messageBox.innerHTML = `
                <span class="emoji">🎉</span>
                Hayırlısı olsun!
                <div style="font-size: 1.2rem; margin-top: 20px; opacity: 0.9;">İşte bu kadardı 😄</div>
            `;
            document.body.appendChild(messageBox);
            setTimeout(() => messageBox.classList.add('show'), 10);
        }
        
        // HAYIR'ı EVET'e dönüştür
        function transformToYes() {
            if (isTransformed || !gameStarted) return;
            isTransformed = true;
            
            const rect = noBtn.getBoundingClientRect();
            createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#2ecc71');
            
            noBtn.classList.add('is-yes');
            noBtn.innerText = 'EVET';
            noBtn.style.transform = 'scale(1.5)';
            
            const originalOnclick = noBtn.onclick;
            noBtn.onclick = () => showMessage();
            
            setTimeout(() => {
                noBtn.classList.remove('is-yes');
                noBtn.innerText = 'HAYIR';
                noBtn.style.transform = 'scale(0.5)';
                noBtn.onclick = originalOnclick;
                isTransformed = false;
            }, 2000);
        }
        
        // Deli gibi kaçma modu
        function activateCrazyMode() {
            if (crazyModeActive || !gameStarted) return;
            crazyModeActive = true;
            
            let crazyCount = 0;
            const crazyInterval = setInterval(() => {
                const rect = noBtn.getBoundingClientRect();
                createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
                
                noBtn.style.animation = 'crazy-spin 0.3s linear';
                posBtn(noBtn, false);
                
                crazyCount++;
                if (crazyCount >= 15) {
                    clearInterval(crazyInterval);
                    noBtn.style.animation = 'vibrate 0.1s infinite';
                    setTimeout(() => {
                        noBtn.style.animation = '';
                        crazyModeActive = false;
                    }, 1000);
                }
            }, 300);
        }
        
        // EVET butonunu HAYIR'ın önüne yerleştir
        function blockWithYesButton() {
            if (blockingActive || !gameStarted) return;
            blockingActive = true;
            
            const blocker = yesButtons[Math.floor(Math.random() * 5)];
            
            blocker.style.transition = 'all 0.2s ease-out';
            blocker.style.left = noBtn.style.left;
            blocker.style.top = noBtn.style.top;
            blocker.style.zIndex = '10000';
            
            const currentScale = parseFloat(blocker.dataset.scale || 1);
            const newScale = Math.max(2.5, currentScale);
            blocker.dataset.scale = newScale;
            blocker.style.transform = `scale(${newScale})`;
            
            setTimeout(() => {
                blocker.style.zIndex = '500';
                blockingActive = false;
            }, 1500);
        }
        
        // HAYIR butonu kaçış fonksiyonu
        function escape() {
            if (!gameStarted) {
                startGame();
                return;
            }
            
            escapeCount++;
            
            const rect = noBtn.getBoundingClientRect();
            createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            
            noBtn.style.transform = `scale(0) rotate(${-180 + Math.random() * 360}deg)`;
            noBtn.style.transition = 'all 0.05s';
            
            setTimeout(() => {
                posBtn(noBtn, false);
                noBtn.style.transform = 'scale(0.5)';
                noBtn.style.transition = 'all 0.15s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                
                // Her kaçışta rastgele 2-4 EVET butonu büyüsün
                const growCount = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < growCount; i++) {
                    const randomYes = yesButtons[Math.floor(Math.random() * 5)];
                    const currentScale = parseFloat(randomYes.dataset.scale || 1);
                    const newScale = Math.min(5, currentScale + (0.3 + Math.random() * 0.5));
                    randomYes.dataset.scale = newScale;
                    randomYes.style.transform = `scale(${newScale})`;
                    randomYes.style.transition = 'all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                }
                
                // Rastgele olaylar
                const random = Math.random();
                if (random < 0.2) {
                    setTimeout(() => transformToYes(), 200);
                } else if (random < 0.4) {
                    setTimeout(() => activateCrazyMode(), 100);
                } else if (random < 0.6) {
                    setTimeout(() => blockWithYesButton(), 150);
                }
                
                // Her 3 kaçışta EVET'ler yeniden dağılsın
                if (escapeCount % 3 === 0) {
                    yesButtons.forEach((btn, idx) => {
                        setTimeout(() => {
                            btn.style.transition = 'all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                            posBtn(btn, true);
                        }, idx * 50);
                    });
                }
                
                // Her 5 kaçışta tüm EVET'ler devleşsin
                if (escapeCount % 5 === 0) {
                    yesButtons.forEach(btn => {
                        const currentScale = parseFloat(btn.dataset.scale || 1);
                        const newScale = Math.min(6, currentScale + 1.2);
                        btn.dataset.scale = newScale;
                        btn.style.transform = `scale(${newScale})`;
                    });
                }
            }, 50);
        }
        
        // Otomatik kaos sistemi - sadece oyun başladığında
        function startChaos() {
            // Her 2-4 saniyede rastgele bir şey olsun
            setInterval(() => {
                if (!gameStarted) return;
                
                const random = Math.random();
                if (random < 0.35) {
                    escape();
                } else if (random < 0.5) {
                    transformToYes();
                } else if (random < 0.65) {
                    blockWithYesButton();
                } else if (random < 0.75) {
                    activateCrazyMode();
                }
            }, 2000 + Math.random() * 2000);
            
            // Her 1-2 saniyede EVET'ler büyüsün
            setInterval(() => {
                if (!gameStarted) return;
                
                const randomYes = yesButtons[Math.floor(Math.random() * 5)];
                const currentScale = parseFloat(randomYes.dataset.scale || 1);
                const newScale = Math.min(6, currentScale + 0.4);
                randomYes.dataset.scale = newScale;
                randomYes.style.transform = `scale(${newScale})`;
            }, 1000 + Math.random() * 1000);
        }
        
        // Orijinal EVET butonuna tıklayınca
        yesBtn.addEventListener('click', () => {
            if (!gameStarted) {
                showMessage();
            }
        });
        
        // HAYIR butonuna yaklaşınca oyun başlasın
        noBtn.addEventListener('mouseenter', escape);
        noBtn.addEventListener('mouseover', escape);
        noBtn.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            escape(); 
        });
        noBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            escape();
        });
    </script>
</body>
</html>
