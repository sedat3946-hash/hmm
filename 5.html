<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Üretim Master v10.4</title>
    <style>
        :root { 
            --seat-red: #cc0000; --seat-black: #0a0a0a; --seat-dark-gray: #151515; 
            --seat-light-gray: #e0e0e0; --accent: #f39c12; --success: #27ae60; 
        }
        body { background-color: var(--seat-black); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: var(--seat-light-gray); }
        .terminal-box { width: 100%; max-width: 400px; background: var(--seat-dark-gray); border-top: 5px solid var(--seat-red); padding: 20px; box-sizing: border-box; }
        .main-panel { background: #000; border: 1px solid #222; border-left: 4px solid var(--seat-red); padding: 12px; margin-bottom: 15px; }
        .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        select, input[type="number"] { background: #111; border: 1px solid #333; color: #fff; padding: 12px; font-size: 14px; font-weight: bold; outline: none; box-sizing: border-box; width: 100%; border-radius: 4px; }
        
        .input-group { flex: 1; }
        .input-active { border: 2px solid var(--seat-red) !important; background: #1a0000 !important; }
        .input-passive { opacity: 0.4; border: 1px solid #222 !important; }

        .v-sonu-btn { background: #222; border: 1px solid #444; color: #777; padding: 0 8px; height: 35px; font-size: 8px; font-weight: bold; cursor: pointer; border-radius: 2px; text-transform: uppercase; flex: 1; margin-top: 14px; animation: glow-red 2.5s infinite ease-in-out; }
        .v-sonu-btn.active { background: var(--seat-red); color: white; border-color: var(--seat-red); animation: none; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .toggle-btn { background: #222; border: 1px solid #444; color: #555; padding: 12px 2px; font-size: 9px; font-weight: bold; cursor: pointer; text-align: center; border-radius: 2px; text-transform: uppercase; transition: 0.2s; }
        .toggle-btn.active { background: var(--seat-red); color: white; border-color: var(--seat-red); }
        .btn-locked { pointer-events: none; opacity: 0.6; cursor: not-allowed; }

        #durusPanel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #000; }
        #durusPanel.open { max-height: 160px; border: 1px solid #333; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        
        .quick-durus-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; margin-top: 8px; }
        .q-btn { background: #222; border: 1px solid #444; color: #fff; padding: 8px 0; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .q-btn:active { background: var(--seat-red); }

        .auto-toggle { font-size: 8px; font-weight: 900; background: #333; color: #777; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
        .auto-toggle.on { background: var(--seat-red); color: white; }
        
        .diff-panel { background: #000; border: 1px solid #222; border-bottom: 4px solid #444; padding: 15px; text-align: center; margin-bottom: 12px; }
        .panel-result { background: #000; border-left: 5px solid var(--accent); padding: 12px; text-align: center; margin-top: 8px; }
        .total-panel { background: #080808; border-top: 5px solid var(--success); padding: 12px; text-align: center; margin-top: 10px; }
        .val-display { font-size: 28px; font-weight: 900; color: #fff; display: block; }
        label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 6px; color: #777; text-transform: uppercase; }
        .low-production { color: var(--seat-red) !important; }
        
        .target-box { margin-top: 10px; padding: 12px; background: #050505; border: 1px solid #1a1a1a; border-radius: 4px; display: flex; flex-direction: column; align-items: center; }
        .target-num { font-size: 44px; color: #fff; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .target-label { font-size: 11px; color: #aaa; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }

        @keyframes glow-red { 0% { box-shadow: 0 0 2px rgba(204,0,0,0.2); } 50% { box-shadow: 0 0 10px rgba(204,0,0,0.6); } 100% { box-shadow: 0 0 2px rgba(204,0,0,0.2); } }
    </style>
</head>
<body onload="setup()">

<div class="terminal-box">
    <div class="header" style="text-align: center; border-bottom: 1px solid #333; margin-bottom: 15px;"><h1 style="margin:0; font-size:16px;">ÜRETİM MASTER v10.4</h1></div>

    <div class="main-panel">
        <div class="panel-row">
            <div style="flex: 1;"><label>Vardiya</label>
                <select id="vBas" onchange="hesapla()">
                    <option value="08:00">08-16 (Gündüz)</option>
                    <option value="16:00">16-00 (Akşam)</option>
                    <option value="00:00">00-08 (Gece)</option>
                </select>
            </div>
        </div>
        <div class="panel-row">
            <div style="flex: 2;"><label>Seçili Saat</label>
                <div style="display:flex; gap:2px"><select id="saatSec" onchange="hesapla()"></select><select id="dakikaSec" onchange="hesapla()"></select></div>
            </div>
            <button id="vSonuBtn" class="v-sonu-btn" onclick="toggleVSonu()">VARDİYA SONU</button>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px"><label>Duruşlar</label><button id="autoModeBtn" class="auto-toggle on" onclick="toggleAutoMode()">OTO MOLA: AÇIK</button></div>
    <div class="btn-grid">
        <div class="toggle-btn btn-locked" style="background: #111;">Hazırlık -10</div>
        <div id="m1" class="toggle-btn" onclick="toggleMola('m1', 10)">1. Çay</div>
        <div id="mYemek" class="toggle-btn" onclick="toggleMola('mYemek', 30)">Yemek</div>
        <div id="m2" class="toggle-btn" onclick="toggleMola('m2', 10)">2. Çay</div>
        <div id="mAparat" class="toggle-btn" onclick="toggleMola('mAparat', 30)">Aparat Dönüşü</div>
        <div id="mDurToggle" class="toggle-btn" onclick="toggleDurusPanel()">Duruş Gir ▼</div>
    </div>

    <div id="durusPanel">
        <label>Ek Duruş Süresi (Dakika)</label>
        <input type="number" id="inputDurus" value="0" oninput="hesapla()">
        <div class="quick-durus-grid">
            <button class="q-btn" onclick="addDurus(5)">+5</button>
            <button class="q-btn" onclick="addDurus(10)">+10</button>
            <button class="q-btn" onclick="addDurus(-5)">-5</button>
            <button class="q-btn" onclick="addDurus(-10)">-10</button>
        </div>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
        <div class="input-group">
            <label>HDL Yapılan</label>
            <input type="number" id="adetHDL" placeholder="0" onfocus="setActive('HDL')" oninput="handleInput('HDL')">
        </div>
        <div class="input-group">
            <label>SWL Yapılan</label>
            <input type="number" id="adetSWL" placeholder="0" onfocus="setActive('SWL')" oninput="handleInput('SWL')">
        </div>
    </div>

    <div id="diffBox" class="diff-panel">
        <span id="targetInfo" style="font-size:38px; font-weight:900; display:block;">0 DK</span>
        <div id="diffVal" style="font-size:11px; font-weight:800; margin-bottom: 10px;">DURUM BEKLENİYOR</div>
        <div id="hdlBox" class="target-box"><span id="hdlTargetVal" class="target-num">0</span><span class="target-label">HDL OLMALIYDI</span></div>
        <div id="swlBox" class="target-box"><span id="swlTargetVal" class="target-num">0</span><span class="target-label">SWL OLMALIYDI</span></div>
    </div>

    <label>ÜRETİMİN DEVAMINDA NE YAPILACAK</label>
    <select id="modelHedef" onchange="hesapla()" style="border-left: 3px solid var(--seat-red); margin-bottom:10px;"><option value="HDL">HDL (50/S)</option><option value="SWL">SWL (45/S)</option></select>

    <div class="panel-result">
        <span style="font-size:10px; font-weight:bold; color:var(--accent);">BU SAATTEN SONRA BASILACAK SAYI</span>
        <span id="sonuc" class="val-display">0</span>
    </div>
    <div class="total-panel">
        <span style="font-size:10px; font-weight:bold; color:var(--success);">VARDİYA SONU NET TOPLAM</span>
        <span id="toplamSonuc" class="val-display">0</span>
    </div>
</div>

<script>
    const HIZ_HDL = 50, HIZ_SWL = 45;
    let isVSonuActive = false, isAutoMode = true, activeMod = 'HDL';
    let aktifMolalar = { m1: 0, mYemek: 0, m2: 0, mAparat: 0 };

    function initLists() {
        const s = document.getElementById('saatSec'), d = document.getElementById('dakikaSec');
        for(let i=0; i<24; i++) s.innerHTML += `<option value="${i}">${i < 10 ? '0'+i : i}</option>`;
        for(let i=0; i<60; i++) d.innerHTML += `<option value="${i}">${i < 10 ? '0'+i : i}</option>`;
    }

    function setup() {
        initLists();
        const now = new Date(), h = now.getHours();
        document.getElementById('saatSec').value = h;
        document.getElementById('dakikaSec').value = now.getMinutes();
        const vBas = document.getElementById('vBas');
        if (h >= 8 && h < 16) vBas.value = "08:00"; else if (h >= 16 && h < 24) vBas.value = "16:00"; else vBas.value = "00:00";
        updateButtonStatus();
        setActive('HDL');
    }

    function updateButtonStatus() {
        const btns = ['m1', 'mYemek', 'm2'];
        btns.forEach(id => {
            const btn = document.getElementById(id);
            if (isAutoMode) btn.classList.add('btn-locked');
            else btn.classList.remove('btn-locked');
        });
    }

    function toggleAutoMode() { 
        isAutoMode = !isAutoMode; 
        document.getElementById('autoModeBtn').classList.toggle('on', isAutoMode);
        document.getElementById('autoModeBtn').innerText = isAutoMode ? "OTO MOLA: AÇIK" : "OTO MOLA: KAPALI";
        updateButtonStatus();
        hesapla(); 
    }

    function setActive(mod) {
        activeMod = mod;
        document.getElementById('adetHDL').className = (mod === 'HDL') ? 'input-active' : 'input-passive';
        document.getElementById('adetSWL').className = (mod === 'SWL') ? 'input-active' : 'input-passive';
        document.getElementById('hdlBox').style.display = (mod === 'HDL') ? "flex" : "none";
        document.getElementById('swlBox').style.display = (mod === 'SWL') ? "flex" : "none";
        hesapla();
    }

    function handleInput(type) { if(type !== activeMod) setActive(type); hesapla(); }

    function addDurus(dk) {
        const inp = document.getElementById('inputDurus');
        let current = parseInt(inp.value) || 0;
        inp.value = Math.max(0, current + dk);
        hesapla();
    }

    function toggleMola(id, sure) {
        if((id === 'm1' || id === 'mYemek' || id === 'm2') && isAutoMode) return; 
        aktifMolalar[id] = (aktifMolalar[id] > 0) ? 0 : sure;
        document.getElementById(id).classList.toggle('active', aktifMolalar[id] > 0);
        hesapla();
    }

    function toggleDurusPanel() {
        const p = document.getElementById('durusPanel');
        p.classList.toggle('open');
        document.getElementById('mDurToggle').innerText = p.classList.contains('open') ? "Kapat ▲" : "Duruş Gir ▼";
    }

    function toggleVSonu() {
        isVSonuActive = !isVSonuActive;
        const vBas = document.getElementById('vBas').value;
        if (isVSonuActive) {
            if (vBas === "08:00") document.getElementById('saatSec').value = 16; 
            else if (vBas === "16:00") document.getElementById('saatSec').value = 0; 
            else document.getElementById('saatSec').value = 8;
            document.getElementById('dakikaSec').value = 0;
        } else {
            const now = new Date(); document.getElementById('saatSec').value = now.getHours(); document.getElementById('dakikaSec').value = now.getMinutes();
        }
        document.getElementById('vSonuBtn').classList.toggle('active', isVSonuActive);
        hesapla();
    }

    function hesapla() {
        const sh = parseInt(document.getElementById('saatSec').value), sm = parseInt(document.getElementById('dakikaSec').value), vBasValue = document.getElementById('vBas').value;
        const modelHedef = document.getElementById('modelHedef').value;
        const ekDurus = parseInt(document.getElementById('inputDurus').value) || 0;
        
        let [bh, bm] = vBasValue.split(':').map(Number);
        let gecenBrut = (sh * 60 + sm) - (bh * 60 + bm);
        if (gecenBrut < 0) gecenBrut += 1440;

        if (isAutoMode) {
            aktifMolalar.m1 = (gecenBrut >= 100) ? 10 : 0;
            aktifMolalar.mYemek = (gecenBrut >= 200) ? 30 : 0;
            aktifMolalar.m2 = (gecenBrut >= 300) ? 10 : 0;
            ['m1', 'mYemek', 'm2'].forEach(id => document.getElementById(id).classList.toggle('active', aktifMolalar[id] > 0));
        }

        // 1. ZAMAN PARAMETRELERİ
        const TOPLAM_VARDİYA_DK = 420; // Duruş ve Aparat Dönüşü Hariç Net Çalışma Alanı
        let toplamDurusDk = aktifMolalar.mAparat + ekDurus;
        let molalarGecen = 10 + aktifMolalar.m1 + aktifMolalar.mYemek + aktifMolalar.m2 + toplamDurusDk;
        let netCalisilanDakika = Math.max(0, gecenBrut - molalarGecen);

        // 2. MEVCUT ÜRETİM VE HARCANAN ZAMAN
        const valHDL = parseFloat(document.getElementById('adetHDL').value) || 0;
        const valSWL = parseFloat(document.getElementById('adetSWL').value) || 0;
        const toplamYapilan = valHDL + valSWL;

        // Üretilen adetlerin ne kadar zaman yediğini hesapla
        let harcananZamanHDL = (valHDL / HIZ_HDL) * 60;
        let harcananZamanSWL = (valSWL / HIZ_SWL) * 60;
        let toplamHarcananZaman = harcananZamanHDL + harcananZamanSWL;

        // 3. KARMA VARDİYA SONU HESABI
        // Kalan Süre = 420 - Yapılanlar için gereken zaman - Aparat/Ek Duruşlar
        let kalanNetKapasiteDk = Math.max(0, TOPLAM_VARDİYA_DK - toplamHarcananZaman - toplamDurusDk);
        let seciliHiz = (modelHedef === 'HDL') ? HIZ_HDL : HIZ_SWL;
        
        // Bu andan sonra yapılacak sayı (Kalan vardiya süresi bazlı)
        let basılacakAdet = Math.round((kalanNetKapasiteDk / 60) * seciliHiz);
        
        // Eğer öndeyse basılacak sayıyı mevcut saate göre tekrar kontrol et (Gerçekçi tahmin için)
        let kalanVardiyaDk = Math.max(0, (480 - gecenBrut - (isAutoMode ? (gecenBrut < 300 ? 10 : 0) : 0))); // Kabaca mola kontrolü
        
        // Vardiya Sonu Net Toplam = Yapılan + Kalan Kapasite
        let karmaVardiyaSonu = toplamYapilan + basılacakAdet;

        // 4. EKRAN GÜNCELLEME
        document.getElementById('hdlTargetVal').innerText = Math.round((netCalisilanDakika / 60) * HIZ_HDL);
        document.getElementById('swlTargetVal').innerText = Math.round((netCalisilanDakika / 60) * HIZ_SWL);

        // Performans Farkı (Aktif kutuya göre)
        let hakEdilenDk = (activeMod === 'HDL') ? harcananZamanHDL : harcananZamanSWL;
        let dkFarki = Math.round(hakEdilenDk - netCalisilanDakika);

        document.getElementById('sonuc').innerText = isVSonuActive ? 0 : basılacakAdet;
        document.getElementById('toplamSonuc').innerText = karmaVardiyaSonu;
        document.getElementById('targetInfo').innerText = (dkFarki > 0 ? "+" : "") + dkFarki + " DK";
        
        let dVal = document.getElementById('diffVal'), dBox = document.getElementById('diffBox');
        if (dkFarki < 0) { 
            dVal.innerText = "GERİDESİN"; dVal.style.color = "var(--seat-red)"; dBox.style.borderBottomColor = "var(--seat-red)"; 
        } else if (dkFarki >= 1) { 
            dVal.innerText = "ÖNDESİN"; dVal.style.color = "var(--success)"; dBox.style.borderBottomColor = "var(--success)"; 
        } else { 
            dVal.innerText = "TAM ZAMANINDA"; dVal.style.color = "#fff"; dBox.style.borderBottomColor = "#444"; 
        }
        
        document.getElementById('toplamSonuc').classList.toggle('low-production', karmaVardiyaSonu < 325);
    }
</script>
</body>
</html>
